<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Index · 编辑式网页示例</title><style>*{box-sizing:border-box}body{margin:0;background:#f4eee4;color:#29251f;font-family:Arial,"Microsoft YaHei",sans-serif}header{padding:24px 5%;display:flex;justify-content:space-between;font-size:11px;border-bottom:1px solid #29251f}main{padding:35px 5%}h1{font:clamp(65px,13vw,150px)/.9 Georgia,serif;letter-spacing:-8px;margin:5px 0 30px}h1 em{font-weight:400}.label{font-size:10px;letter-spacing:2px}.work{display:grid;grid-template-columns:1.2fr 1fr;gap:6%;border-top:1px solid;padding:28px 0}.art{position:relative;background:#e6552a;aspect-ratio:1.4;overflow:hidden}.art i{position:absolute;width:65%;height:90%;border:25px solid #f2c798;border-radius:50%;left:10%;top:15%;transform:rotate(-30deg)}.art i:nth-child(2){left:30%;top:-25%;border-color:#442817}.story h2{font:40px/1.1 Georgia,serif;letter-spacing:-1px}.story p{max-width:280px;line-height:1.8;font-size:13px}button{padding:12px 0;background:none;border:0;border-bottom:1px solid;color:inherit;font:inherit;cursor:pointer}.alt .art{background:#515dce}.alt .art i{border-color:#c9d7fa}.alt .art i:nth-child(2){border-color:#253054}button:focus-visible{outline:3px solid #e6552a;outline-offset:4px}footer{padding:24px 5%;font-size:11px;border-top:1px solid}@media(max-width:550px){h1{letter-spacing:-4px}.work{grid-template-columns:1fr}.story h2{font-size:32px}.art{aspect-ratio:1.5}}</style><header><span>PAPER INDEX®</span><span>ART / OBJECTS / PERSPECTIVES</span><span>VOL. 01</span></header><main><h1>Notes on<br><em>everything.</em></h1><div class="work"><div class="art" role="img" aria-label="交错圆环抽象构图"><i></i><i></i></div><div class="story"><span class="label">01 / FORM & FEELING</span><h2>The beauty<br>in between.</h2><p>把日常里的片段，编排成值得停留的页面。文字有自己的节奏，图像留有呼吸的空间。</p><button id="palette" aria-pressed="false">切换画面配色 ↗</button></div></div></main><footer>即现 · 编辑式界面
